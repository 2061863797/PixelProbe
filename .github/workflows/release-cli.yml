name: 打包并发布 CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-package:
    name: 构建 Python 包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装构建工具
        run: python -m pip install --upgrade build
      - name: 构建 wheel 和源码包
        run: python -m build
      - name: 检查包内容与元数据
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  standalone-cli:
    name: 构建 ${{ matrix.archive_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive_name: pixelprobe-windows-x86_64
            executable: pixelprobe.exe
            archive: pixelprobe-windows-x86_64.zip
          - os: ubuntu-latest
            archive_name: pixelprobe-linux-x86_64
            executable: pixelprobe
            archive: pixelprobe-linux-x86_64.tar.gz
          - os: macos-14
            archive_name: pixelprobe-macos-arm64
            executable: pixelprobe
            archive: pixelprobe-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装项目和打包工具
        run: python -m pip install . pyinstaller
      - name: 构建独立 CLI
        run: python -m PyInstaller --noconfirm --clean packaging/pixelprobe.spec
      - name: 验证独立 CLI
        shell: bash
        run: |
          ./dist/${{ matrix.executable }} --version
          ./dist/${{ matrix.executable }} --help
      - name: 整理发布目录
        shell: bash
        run: |
          mkdir "${{ matrix.archive_name }}"
          cp "dist/${{ matrix.executable }}" "${{ matrix.archive_name }}/"
          cp README.md README_EN.md LICENSE "${{ matrix.archive_name }}/"
      - name: 压缩 Windows 产物
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path '${{ matrix.archive_name }}' -DestinationPath '${{ matrix.archive }}'
      - name: 压缩 Unix 产物
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.archive }}" "${{ matrix.archive_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-package, standalone-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: 生成 SHA-256 校验文件
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: 创建 Release 并上传全部产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --repo "${{ github.repository }}" --generate-notes --verify-tag
