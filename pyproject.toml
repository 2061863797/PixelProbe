[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelprobe"
dynamic = ["version"]
description = "本地图片与视频确定性分析工具"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "PixelProbe" }]
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "av>=12",
    "numpy>=1.26",
    "pillow>=10",
    "pydantic>=2",
]

[project.optional-dependencies]
flow = ["opencv-python-headless>=4.10"]
storage = ["zarr>=3.1,<4"]
mcp = ["mcp>=1.27,<2"]
dev = ["pytest>=8", "opencv-python-headless>=4.10", "mcp>=1.27,<2"]

[project.urls]
Homepage = "https://github.com/2061863797/PixelProbe"
Repository = "https://github.com/2061863797/PixelProbe"

[project.scripts]
pixelprobe = "pixelprobe.cli.app:main"
pixelprobe-mcp = "pixelprobe_mcp.entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pixelprobe.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# tests/assets 是历史遗留的运行时产物目录，可能残留被锁定的临时子目录
norecursedirs = ["assets", ".*", "build", "dist"]
