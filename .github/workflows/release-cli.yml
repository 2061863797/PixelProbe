name: 发布 Python 包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: 发布前完整测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装项目与测试依赖
        run: python -m pip install ".[dev,storage,evidence]"
      - name: 运行完整测试
        run: python -m pytest

  python-package:
    name: 构建 Python 包
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装构建工具
        run: python -m pip install --upgrade build
      - name: 构建 wheel 和源码包
        run: python -m build
      - name: 检查包内容与元数据
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: 在干净虚拟环境安装 wheel
        run: |
          python -m venv .wheel-smoke
          ./.wheel-smoke/bin/python -m pip install dist/*.whl
          ./.wheel-smoke/bin/pixelprobe --version
          ./.wheel-smoke/bin/pixelprobe --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: 生成 SHA-256 校验文件
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: 创建 Release 并上传全部产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --repo "${{ github.repository }}" --generate-notes --verify-tag
